<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Document background (vibrant teal/turquoise) -->
  <rect x="40" y="20" width="120" height="160" rx="4" fill="#14B8A6"/>
  
  <!-- Folded corner (dark purple/indigo) - upper right -->
  <path d="M 160 20 L 160 60 L 120 60 L 120 20 Z" fill="#4C1D95"/>
  <path d="M 160 20 L 120 60 L 120 20 Z" fill="#6D28D9"/>
  <!-- Shadow effect for folded corner -->
  <path d="M 120 20 L 160 20 L 160 60" stroke="#1E1B4B" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Text lines (black) - upper half -->
  <!-- Three longer lines -->
  <line x1="55" y1="45" x2="145" y2="45" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="60" x2="145" y2="60" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="75" x2="145" y2="75" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- One shorter line -->
  <line x1="55" y1="90" x2="115" y2="90" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Two more longer lines -->
  <line x1="55" y1="105" x2="145" y2="105" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="120" x2="145" y2="120" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Bar chart (purple/indigo bars) - lower half, progressively increasing -->
  <rect x="55" y="140" width="15" height="20" fill="#4C1D95" rx="2"/>
  <rect x="75" y="130" width="15" height="30" fill="#4C1D95" rx="2"/>
  <rect x="95" y="120" width="15" height="40" fill="#4C1D95" rx="2"/>
  <rect x="115" y="110" width="15" height="50" fill="#4C1D95" rx="2"/>
</svg>
